name: Deploy MOODCUT Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/quick-worker/**"
      - ".github/workflows/deploy-moodcut-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy quick-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy quick-worker --project-ref tidrkegmipucdcoqdxvd --no-verify-jwt
