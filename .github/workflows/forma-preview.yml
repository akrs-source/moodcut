name: Deploy FORMA live preview

on:
  push:
    branches: [nutrition-app-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout FORMA work branch
        uses: actions/checkout@v4
        with:
          ref: nutrition-app-rebuild
          path: forma-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current production site unchanged
        working-directory: main-src
        run: |
          npm install
          npm run build

      - name: Keep production site and prepare preview folder
        run: |
          mkdir -p site
          cp -R main-src/dist/. site/
          mkdir -p site/preview

      - name: Build FORMA preview
        working-directory: forma-src
        run: |
          npm install
          npm run build -- --base=/moodcut/preview/

      - name: Add FORMA preview without replacing production files
        run: cp -R forma-src/dist/. site/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
