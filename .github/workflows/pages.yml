name: Deploy MOODCUT and FORMA preview

on:
  push:
    branches: [main, nutrition-app-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main site
        run: |
          npm install
          npm run build

      - name: Checkout FORMA preview source
        uses: actions/checkout@v4
        with:
          ref: nutrition-app-rebuild
          path: forma-src
      - name: Build FORMA preview
        working-directory: forma-src
        run: |
          npm install
          npm run build -- --base=/moodcut/preview/
      - name: Add FORMA preview without replacing main site
        run: |
          mkdir -p dist/preview
          cp -R forma-src/dist/. dist/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
